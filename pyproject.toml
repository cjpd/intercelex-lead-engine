[project]
name = "intercelex-lead-engine"
version = "0.1.0"
description = "Multi-agent lead generation system for an organic fertilizer company in the Redland (Homestead, FL)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Pedroso" }]

dependencies = [
    # Anthropic + agent orchestration
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0",

    # Data contracts
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # HTTP / data sources
    "httpx>=0.27",
    "tenacity>=8.2",          # retries against flaky public APIs

    # Storage
    # sqlite3 is in stdlib; we use sqlalchemy for ergonomics + migrations later
    "sqlalchemy>=2.0",

    # UI
    "streamlit>=1.32",
    "pydeck>=0.9",            # for the Coverage map

    # Observability (lightweight; swap for langfuse/braintrust later if needed)
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",        # notebooks/
]

[project.scripts]
intercelex-evals = "src.eval.run_evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
